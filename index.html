    .hero{position:relative;overflow:hidden;display:grid;gap:24px;padding:34px;border-radius:26px;background:linear-gradient(115deg,#173a52,#235676);color:white;box-shadow:var(--shadow);margin-bottom:38px}

    .toast-stack{position:fixed;z-index:80;right:16px;bottom:16px;display:grid;gap:8px;width:min(360px,calc(100% - 32px))}.toast{padding:13px 16px;border-radius:12px;background:var(--navy);color:#fff;box-shadow:var(--shadow);font-size:.87rem;animation:popIn .2s ease-out}.toast.error{background:var(--danger)}

  </style>

        {id:'r16',eventId:'e5',name:'Helena Barbosa',email:'helena@email.com',phone:'11993334455',quantity:2,status:'pending',notes:'',createdAt:pastDate(8)},
        {id:'r17',eventId:'e5',name:'Antônio Ferreira',email:'antonio@email.com',phone:'11995556677',quantity:2,status:'paid',notes:'',createdAt:pastDate(5)},
        {id:'r18',eventId:'e6',name:'Maria Silva',email:'maria@email.com',phone:'11987654321',quantity:2,status:'pending',notes:'',createdAt:pastDate(4)},
        {id:'r19',eventId:'e6',name:'João Oliveira',email:'joao@email.com',phone:'11991234567',quantity:1,status:'paid',notes:'',createdAt:pastDate(3)},
        {id:'r20',eventId:'e6',name:'Fernanda Dias',email:'fernanda@email.com',phone:'11984445566',quantity:2,status:'pending',notes:'',createdAt:pastDate(2)}
      ]
    };

    /* DADOS E PERSISTÊNCIA: estas funções concentram as operações para futura troca por API. */
    const STORAGE_KEY = 'nome-do-sistema-dados-v1';
    const SESSION_KEY = 'nome-do-sistema-sessao-v1';
    const REGISTERED_USERS_KEY = 'nome-do-sistema-usuarios-v1';
    let data = loadData();
    let registeredUsers = loadRegisteredUsers();
    let currentUser = loadSession();
    let pendingRegistrationEventId = null;
    let page = currentUser?.role === 'admin' ? 'dashboard' : 'home';
    let selectedEventId = null;
    let participantSearch = '';
    let participantCategory = '';
    let adminSearch = '';
    let adminStatus = '';
    const categories = ['Retiro','Peregrinação','Passeio','Encontro'];
    const icons = {'Retiro':'🕊️','Peregrinação':'⛪','Passeio':'🌿','Encontro':'🤝'};
    const slug = {'Retiro':'retiro','Peregrinação':'peregrinacao','Passeio':'passeio','Encontro':'encontro'};

    function cloneSeed() { return JSON.parse(JSON.stringify(SEED_DATA)); }
    function loadData() { try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (saved && Array.isArray(saved.events) && Array.isArray(saved.registrations)) return saved; } catch (_) {} const seed = cloneSeed(); localStorage.setItem(STORAGE_KEY, JSON.stringify(seed)); return seed; }
    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    function loadRegisteredUsers() { try { const saved = JSON.parse(localStorage.getItem(REGISTERED_USERS_KEY)); return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {}; } catch (_) { return {}; } }
    function getUser(email) { return USERS[email] || registeredUsers[email]; }
    function getEvents() { return [...data.events].sort((a,b) => a.date.localeCompare(b.date)); }
    function getEvent(id) { return data.events.find(event => event.id === id); }
    function getRegistrations(eventId) { return data.registrations.filter(reg => !eventId || reg.eventId === eventId); }
    function occupiedSeats(eventId) { return getRegistrations(eventId).filter(reg => reg.status !== 'canceled').reduce((sum,reg) => sum + Number(reg.quantity),0); }
    function remainingSeats(event) { return Math.max(0, Number(event.capacity) - occupiedSeats(event.id)); }
    function createEvent(values) { const event = {id:uid('e'),...values}; data.events.push(event); saveData(); return event; }
    function updateEvent(id,values) { const event = getEvent(id); if (!event) return null; Object.assign(event,values); saveData(); return event; }
    function deleteEvent(id) { data.events = data.events.filter(event => event.id !== id); data.registrations = data.registrations.filter(reg => reg.eventId !== id); saveData(); }
    function createRegistration(values) { const event = getEvent(values.eventId); if (!event || Number(values.quantity) > remainingSeats(event)) throw new Error('Não há vagas suficientes para esta inscrição.'); const reg = {id:uid('r'),status:'pending',createdAt:new Date().toISOString(),...values}; data.registrations.push(reg); saveData(); return reg; }
    function markAsPaid(id) { const reg = data.registrations.find(item => item.id === id); if (reg && reg.status !== 'canceled') { reg.status = 'paid'; saveData(); } }
    function markAsPending(id) { const reg = data.registrations.find(item => item.id === id); if (reg && reg.status !== 'canceled') { reg.status = 'pending'; saveData(); } }
    function cancelRegistration(id) { const reg = data.registrations.find(item => item.id === id); if (reg) { reg.status = 'canceled'; saveData(); } }
    function uid(prefix) { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`; }

    /* FORMATAÇÃO E SEGURANÇA DE TEXTO */
    const brl = value => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(value));
    const formatDate = value => new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(`${value}T12:00:00`));
    const formatShortDate = value => new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(`${value}T12:00:00`));
    const formatTimestamp = value => new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(value));
    const safe = value => String(value ?? '').replace(/[&<>"']/g,char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const normalized = value => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const statusText = status => ({paid:'Pago',pending:'Pendente de pagamento',canceled:'Cancelada'}[status] || status);
    const statusBadge = status => `<span class="badge badge-${status === 'paid' ? 'paid' : status === 'canceled' ? 'canceled' : 'pending'}">${statusText(status)}</span>`;
    const occupancy = event => Math.min(100,Math.round(occupiedSeats(event.id) / Number(event.capacity) * 100));
    const progress = event => `<div class="progress-head"><span>${occupiedSeats(event.id)} de ${event.capacity} vagas ocupadas</span><span>${remainingSeats(event)} restantes</span></div><div class="progress" role="progressbar" aria-label="Ocupação das vagas" aria-valuenow="${occupiedSeats(event.id)}" aria-valuemin="0" aria-valuemax="${event.capacity}"><span style="width:${occupancy(event)}%"></span></div>`;

    /* AUTENTICAÇÃO */
    function loadSession() { try { const email = sessionStorage.getItem(SESSION_KEY); const user = getUser(email); return user ? {email,...user} : null; } catch (_) { return null; } }
    function login(email,password) { const key = email.trim().toLowerCase(); const user = getUser(key); if (!user || user.password !== password) return false; finishAuthentication(key,user); return true; }
    function finishAuthentication(email,user) {
      sessionStorage.setItem(SESSION_KEY,email);
      currentUser = {email,...user};
      const eventId = pendingRegistrationEventId;
      pendingRegistrationEventId = null;
      page = user.role === 'admin' ? 'dashboard' : 'home';
      render();
      if (eventId && user.role === 'participante') showRegistrationForm(eventId);
    }
    function createAccount(values) {
      const email = values.email.trim().toLowerCase();
      if (getUser(email)) throw new Error('Este e-mail já está cadastrado. Entre na sua conta.');
      const user = {name:values.name.trim(),phone:values.phone.trim(),password:values.password,role:'participante'};
      registeredUsers[email] = user;
      localStorage.setItem(REGISTERED_USERS_KEY,JSON.stringify(registeredUsers));
      finishAuthentication(email,user);
    }
    function logout() { sessionStorage.removeItem(SESSION_KEY); currentUser = null; selectedEventId = null; pendingRegistrationEventId = null; page = 'home'; render(); }

    /* RENDERIZAÇÃO */
    function brand() { return `<span class="brand-mark" aria-hidden="true">✦</span><span><span class="brand-name">${safe(CONFIG.APP_NAME)}</span><span class="brand-sub">Eventos & excursões</span></span>`; }
    function render() {
      document.title = CONFIG.APP_NAME;
      for (const [key,value] of Object.entries(CONFIG.COLORS)) document.documentElement.style.setProperty(`--${key.replace(/[A-Z]/g,letter => '-' + letter.toLowerCase())}`,value);
      document.getElementById('app').innerHTML = !currentUser && page === 'login' ? renderLogin() : !currentUser && page === 'signup' ? renderSignup() : renderShell();
      if (page === 'home' && currentUser?.role !== 'admin') filterParticipantEvents();
      if (currentUser?.role === 'admin' && page === 'event-detail') filterAdminRegistrations();
    }
    function renderLogin() { return `<div class="login-wrap"><div class="login-side"><div class="brand">${brand()}</div><h1>Boas jornadas começam com um encontro.</h1><p>${safe(CONFIG.TAGLINE)}</p></div><main class="login-main"><div class="login-card"><a href="#" class="back-link" data-page="home">← Ver eventos sem entrar</a><div class="brand">${brand()}</div><span class="eyebrow">Bem-vindo de volta</span><h2>Entre na sua conta</h2><p class="muted">${pendingRegistrationEventId ? 'Entre para continuar sua inscrição.' : 'Acompanhe suas inscrições e os próximos encontros da comunidade.'}</p><form id="login-form"><div class="field"><label for="login-email">E-mail</label><input class="input" id="login-email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="login-password">Senha</label><input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required></div><p class="form-error" id="login-error" role="alert"></p><button class="btn" type="submit">Entrar</button></form><div class="login-links"><button class="btn-link" type="button" data-page="signup">Criar conta</button><button class="btn-link" type="button" data-soon="Recuperação de senha">Esqueci minha senha <span class="soon">Em breve</span></button></div><div class="demo-box"><strong>Para explorar a demonstração</strong><p>Administradora: admin@excursoes.com / admin123</p><p>Participante: maria@email.com / maria123</p></div></div></main></div>`; }
    function renderSignup() { return `<div class="login-wrap"><div class="login-side"><div class="brand">${brand()}</div><h1>Há sempre lugar para mais uma boa história.</h1><p>${safe(CONFIG.TAGLINE)}</p></div><main class="login-main"><div class="login-card"><a href="#" class="back-link" data-page="home">← Ver eventos sem entrar</a><div class="brand">${brand()}</div><span class="eyebrow">Participe com a gente</span><h2>Crie sua conta</h2><p class="muted">${pendingRegistrationEventId ? 'Cadastre-se para reservar sua vaga. Depois, você volta à inscrição.' : 'Cadastre-se para acompanhar e reservar seus encontros.'}</p><form id="signup-form"><div class="field"><label for="signup-name">Nome completo *</label><input class="input" id="signup-name" name="name" autocomplete="name" maxlength="100" required></div><div class="field"><label for="signup-email">E-mail *</label><input class="input" id="signup-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="signup-phone">Telefone com DDD *</label><input class="input" id="signup-phone" name="phone" type="tel" autocomplete="tel" placeholder="(11) 99999-9999" required></div><div class="field"><label for="signup-password">Senha (mínimo de 6 caracteres) *</label><input class="input" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label for="signup-confirm">Confirme a senha *</label><input class="input" id="signup-confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" required></div><p class="form-error" id="signup-error" role="alert"></p><button class="btn" type="submit">Criar conta e continuar</button></form><div class="login-links"><span class="muted small">Já tem uma conta?</span><button class="btn-link" type="button" data-page="login">Entrar</button></div><p class="small muted" style="margin-top:23px">Modo demonstração: sua conta fica salva apenas neste navegador.</p></div></main></div>`; }
    function renderShell() {
      const admin = currentUser?.role === 'admin';
      const participant = currentUser?.role === 'participante';
      return `<header class="site-header"><div class="container header-inner"><a href="#" class="brand" data-page="${admin ? 'dashboard' : 'home'}" aria-label="Página inicial de ${safe(CONFIG.APP_NAME)}">${brand()}</a><div class="header-actions"><nav class="nav-links" aria-label="Navegação principal">${admin ? `<button class="nav-btn ${page === 'dashboard' ? 'active' : ''}" data-page="dashboard">Visão geral</button><button class="nav-btn ${page === 'admin-events' || page === 'event-detail' ? 'active' : ''}" data-page="admin-events">Eventos</button>` : `<button class="nav-btn ${page === 'home' ? 'active' : ''}" data-page="home">Eventos</button>${participant ? `<button class="nav-btn ${page === 'mine' ? 'active' : ''}" data-page="mine">Minhas inscrições</button>` : ''}`}</nav>${currentUser ? `<span class="user-chip">Olá, ${safe(currentUser.name.split(' ')[0])}</span><button class="btn btn-outline btn-sm" data-action="logout">Sair</button>` : `<button class="btn btn-outline btn-sm" data-page="login">Entrar</button><button class="btn btn-primary btn-sm" data-page="signup">Criar conta</button>`}</div></div></header><main class="main container">${admin ? renderAdmin() : renderParticipant()}</main><footer class="footer"><div class="container">${safe(CONFIG.APP_NAME)} · ${safe(CONFIG.TAGLINE)}</div></footer>`;
    }
    function renderParticipant() { return currentUser?.role === 'participante' && page === 'mine' ? renderMyRegistrations() : renderParticipantHome(); }
    function renderParticipantHome() { return `<section class="hero"><div><span class="eyebrow">Caminhos para compartilhar</span><h1>Viva momentos que ficam no coração.</h1><p>Escolha seu próximo encontro e venha viver esta experiência com a nossa comunidade.</p><button class="btn btn-primary" data-action="scroll-events">Explorar eventos →</button></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 200 200" fill="none"><circle cx="100" cy="100" r="75" fill="#f2e5cb"/><path d="M27 142c23-30 48-37 73-11 25-26 50-19 73 11" fill="#8eaeb1"/><path d="M54 154c17-31 35-42 46-42s29 11 46 42" fill="#fff8e9"/><path d="M94 50h12v59H94z" fill="#c39051"/><path d="M76 66h48v10H76z" fill="#c39051"/><circle cx="151" cy="59" r="13" fill="#f1c47f"/></svg></div></section><section id="events-section"><div class="section-heading"><div><span class="eyebrow">Próximas experiências</span><h2>Eventos disponíveis</h2></div><p class="muted small">Encontre o encontro ideal para você</p></div><div class="filters"><div class="field"><label for="event-search">Buscar por nome</label><input class="input" id="event-search" type="search" placeholder="Ex.: peregrinação" value="${safe(participantSearch)}"></div><div class="field"><label for="event-category">Categoria</label><select class="select" id="event-category"><option value="">Todas as categorias</option>${categories.map(category => `<option ${participantCategory === category ? 'selected' : ''}>${category}</option>`).join('')}</select></div></div><div id="event-grid" class="event-grid"></div></section>`; }
    function eventCard(event) { const remaining = remainingSeats(event); return `<article class="event-card"><div class="card-cover cover-${slug[event.category] || 'encontro'}"><span class="cover-tag">${safe(event.category)}</span><span class="cover-icon" aria-hidden="true">${icons[event.category] || '✦'}</span></div><div class="card-body"><h3>${safe(event.title)}</h3><div class="meta"><span>📅 ${formatShortDate(event.date)}</span><span>📍 ${safe(event.location)}</span></div><p>${safe(event.description.length > 122 ? event.description.slice(0,122) + '…' : event.description)}</p><div class="card-bottom"><span class="price">${brl(event.price)}</span><span class="small muted"> / pessoa</span>${progress(event)}<div class="card-actions"><button class="btn btn-outline btn-sm" data-action="details" data-id="${safe(event.id)}">Ver detalhes</button><button class="btn btn-sm" data-action="register" data-id="${safe(event.id)}" ${remaining === 0 ? 'disabled' : ''}>${remaining === 0 ? 'Esgotado' : 'Quero me inscrever'}</button></div></div></div></article>`; }
    function filterParticipantEvents() { const grid = document.getElementById('event-grid'); if (!grid) return; const events = getEvents().filter(event => (!participantCategory || event.category === participantCategory) && normalized(event.title).includes(normalized(participantSearch))); grid.innerHTML = events.length ? events.map(eventCard).join('') : emptyState('🔎','Nenhum evento encontrado','Tente outro nome ou escolha uma categoria diferente.'); }
    function renderMyRegistrations() { const regs = getRegistrations().filter(reg => reg.email.toLowerCase() === currentUser.email).sort((a,b) => b.createdAt.localeCompare(a.createdAt)); return `<div class="section-heading"><div><span class="eyebrow">Sua jornada</span><h2>Minhas inscrições</h2></div><button class="btn btn-outline" data-page="home">Ver eventos</button></div><div class="registration-list">${regs.length ? regs.map(reg => { const event = getEvent(reg.eventId); if (!event) return ''; return `<article class="registration-card"><div><h3>${safe(event.title)}</h3><p class="muted small">${formatDate(event.date)} · ${safe(event.location)}</p><p class="small">${reg.quantity} ${reg.quantity === 1 ? 'pessoa' : 'pessoas'} · Total ${brl(event.price * reg.quantity)} · Reservada em ${formatTimestamp(reg.createdAt)}</p>${statusBadge(reg.status)}</div><div class="registration-actions"><button class="btn btn-outline btn-sm" data-soon="Pagamento online por PIX ou cartão">Pagar online <span class="soon">Em breve</span></button>${reg.status !== 'canceled' ? `<button class="btn btn-link btn-sm" data-action="cancel-registration" data-id="${safe(reg.id)}">Cancelar inscrição</button>` : ''}</div></article>`; }).join('') : emptyState('🌿','Você ainda não tem inscrições','Explore os eventos e reserve seu lugar em um próximo encontro.')}</div>`; }
    function renderAdmin() { if (page === 'admin-events') return renderAdminEvents(); if (page === 'event-detail') return renderAdminEventDetail(); return renderDashboard(); }
    function dashboardStats() { const active = getRegistrations().filter(reg => reg.status !== 'canceled'); const paid = active.filter(reg => reg.status === 'paid'); const pending = active.filter(reg => reg.status === 'pending'); const amount = regs => regs.reduce((sum,reg) => sum + (getEvent(reg.eventId)?.price || 0) * reg.quantity,0); return [{label:'Total de eventos',value:getEvents().length},{label:'Total de inscritos',value:active.reduce((sum,reg) => sum + reg.quantity,0)},{label:'Pagamentos confirmados',value:paid.length},{label:'Pagamentos pendentes',value:pending.length},{label:'Valor arrecadado',value:brl(amount(paid))},{label:'Valor a receber',value:brl(amount(pending))}]; }
    function renderDashboard() { return `<div class="section-heading"><div><span class="eyebrow">Painel administrativo</span><h2>Olá, ${safe(currentUser.name.split(' ')[0])}!</h2><p class="muted">Acompanhe sua comunidade e organize os próximos encontros.</p></div><button class="btn btn-primary" data-action="new-event">+ Novo evento</button></div><p class="admin-note">Modo demonstração: os dados ficam salvos apenas neste navegador.</p><div class="stat-grid">${dashboardStats().map(stat => `<div class="stat-card"><span class="stat-label">${stat.label}</span><strong>${stat.value}</strong></div>`).join('')}</div><div class="section-heading"><div><span class="eyebrow">Acompanhe de perto</span><h2>Próximos eventos</h2></div><button class="btn btn-outline" data-page="admin-events">Ver todos</button></div><div class="admin-events">${getEvents().slice(0,4).map(adminEventRow).join('') || emptyState('📅','Nenhum evento cadastrado','Crie o primeiro evento para começar.')}</div><div class="quick-actions"><button class="btn btn-outline btn-sm" data-soon="Gerenciamento de outros administradores">Gerenciar administradores <span class="soon">Em breve</span></button><button class="btn btn-outline btn-sm" data-soon="Relatórios financeiros avançados">Relatórios financeiros <span class="soon">Em breve</span></button><button class="btn btn-outline btn-sm" data-action="restore-demo">Restaurar dados de demonstração</button></div>`; }
    function adminEventRow(event) { return `<article class="admin-event"><div><h3>${safe(event.title)}</h3><div class="meta"><span>${formatShortDate(event.date)}</span><span>${safe(event.category)}</span><span>${safe(event.location)}</span></div>${progress(event)}</div><button class="btn btn-outline btn-sm" data-action="manage-event" data-id="${safe(event.id)}">Gerenciar evento →</button></article>`; }
    function renderAdminEvents() { return `<div class="section-heading"><div><span class="eyebrow">Organização</span><h2>Eventos</h2><p class="muted">Crie e acompanhe todos os encontros da comunidade.</p></div><button class="btn btn-primary" data-action="new-event">+ Novo evento</button></div><p class="admin-note">Modo demonstração: os dados ficam salvos apenas neste navegador.</p><div class="admin-events">${getEvents().map(adminEventRow).join('') || emptyState('📅','Nenhum evento cadastrado','Clique em “Novo evento” para começar.')}</div><div class="quick-actions"><button class="btn btn-outline btn-sm" data-action="restore-demo">Restaurar dados de demonstração</button></div>`; }
    function renderAdminEventDetail() { const event = getEvent(selectedEventId); if (!event) { page = 'admin-events'; return renderAdminEvents(); } return `<a href="#" class="back-link" data-page="admin-events">← Voltar aos eventos</a><div class="section-heading"><div><span class="eyebrow">Gerenciar evento</span><h2>${safe(event.title)}</h2><p class="muted">${formatDate(event.date)} às ${safe(event.time)} · ${safe(event.location)}</p></div><div class="toolbar"><button class="btn btn-outline btn-sm" data-action="preview-event" data-id="${safe(event.id)}">Prévia para participantes</button><button class="btn btn-outline btn-sm" data-action="edit-event" data-id="${safe(event.id)}">Editar</button><button class="btn btn-danger btn-sm" data-action="delete-event" data-id="${safe(event.id)}">Excluir</button></div></div><div class="panel">${progress(event)}<p class="small muted" style="margin:12px 0 0">${brl(event.price)} por pessoa · Saída: ${safe(event.departure)}</p></div><div class="section-heading" style="margin-top:30px"><div><span class="eyebrow">Participantes</span><h2>Inscrições</h2></div><div class="toolbar"><button class="btn btn-outline btn-sm" data-action="export-csv" data-id="${safe(event.id)}">Exportar lista (CSV)</button><button class="btn btn-primary btn-sm" data-action="manual-registration" data-id="${safe(event.id)}" ${remainingSeats(event) === 0 ? 'disabled' : ''}>+ Inscrição manual</button></div></div><div class="filters"><div class="field"><label for="admin-search">Buscar por nome</label><input id="admin-search" class="input" type="search" placeholder="Nome do inscrito" value="${safe(adminSearch)}"></div><div class="field"><label for="admin-status">Status</label><select id="admin-status" class="select"><option value="">Todos os status</option><option value="pending" ${adminStatus === 'pending' ? 'selected' : ''}>Pendente</option><option value="paid" ${adminStatus === 'paid' ? 'selected' : ''}>Pago</option><option value="canceled" ${adminStatus === 'canceled' ? 'selected' : ''}>Cancelada</option></select></div></div><div class="panel table-wrap" id="admin-registration-table"></div><div class="quick-actions"><button class="btn btn-outline btn-sm" data-soon="Envio de e-mail ou WhatsApp de confirmação">Enviar confirmações <span class="soon">Em breve</span></button><button class="btn btn-outline btn-sm" data-soon="Pagamento online por PIX ou cartão">Pagamento online <span class="soon">Em breve</span></button></div>`; }
    function filterAdminRegistrations() { const root = document.getElementById('admin-registration-table'); if (!root) return; const regs = getRegistrations(selectedEventId).filter(reg => normalized(reg.name).includes(normalized(adminSearch)) && (!adminStatus || reg.status === adminStatus)).sort((a,b) => b.createdAt.localeCompare(a.createdAt)); root.innerHTML = regs.length ? `<table class="table"><thead><tr><th>Nome</th><th>Contato</th><th>Pessoas</th><th>Inscrição</th><th>Pagamento</th><th>Ações</th></tr></thead><tbody>${regs.map(reg => `<tr><td><strong>${safe(reg.name)}</strong>${reg.notes ? `<br><span class="muted tiny">${safe(reg.notes)}</span>` : ''}</td><td>${safe(reg.email)}<br>${safe(reg.phone)}</td><td>${reg.quantity}</td><td>${formatTimestamp(reg.createdAt)}</td><td>${statusBadge(reg.status)}</td><td><div class="row-actions">${reg.status === 'pending' ? `<button class="btn btn-outline btn-sm" data-action="mark-paid" data-id="${safe(reg.id)}">Marcar pago</button>` : reg.status === 'paid' ? `<button class="btn btn-outline btn-sm" data-action="mark-pending" data-id="${safe(reg.id)}">Voltar a pendente</button>` : ''}${reg.status !== 'canceled' ? `<button class="btn btn-link btn-sm" data-action="cancel-registration" data-id="${safe(reg.id)}">Cancelar</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : emptyState('📋','Nenhuma inscrição encontrada','Ajuste a busca ou adicione uma inscrição manualmente.'); }
    function emptyState(icon,title,description) { return `<div class="empty-state"><div class="empty-icon" aria-hidden="true">${icon}</div><h3>${title}</h3><p>${description}</p></div>`; }

    /* MODAIS E FEEDBACK */
    function openModal(title,content) { document.getElementById('modal-root').innerHTML = `<div class="modal-layer" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close" type="button" data-action="close-modal" aria-label="Fechar">×</button><h2 id="modal-title">${title}</h2>${content}</section></div>`; document.body.classList.add('modal-open'); setTimeout(() => document.querySelector('.modal input, .modal select, .modal button')?.focus(),0); }
    function closeModal() { document.getElementById('modal-root').innerHTML = ''; document.body.classList.remove('modal-open'); }
    function toast(message,error=false) { const item = document.createElement('div'); item.className = `toast${error ? ' error' : ''}`; item.textContent = message; document.getElementById('toast-root').append(item); setTimeout(() => item.remove(),4200); }
    function notImplemented(featureName) { openModal('Em breve',`<p>Funcionalidade ainda não desenvolvida. Em breve estará disponível.</p><p class="muted small">${safe(featureName)}</p><div class="form-actions"><button class="btn" data-action="close-modal">Entendi</button></div>`); }
    function showEventDetails(id) { const event = getEvent(id); if (!event) return; openModal(safe(event.title),`<div class="detail-grid"><div><p>${safe(event.description)}</p><div class="info-block"><h4>Programação</h4><p>${safe(event.schedule)}</p></div><div class="info-block"><h4>O que levar</h4><p>${safe(event.bring)}</p></div></div><aside><p><strong>Data</strong><br>${formatDate(event.date)} às ${safe(event.time)}</p><p><strong>Local</strong><br>${safe(event.location)}</p><p><strong>Saída</strong><br>${safe(event.departure)}</p><p><strong>Valor</strong><br>${brl(event.price)} por pessoa</p><p><strong>Vagas restantes</strong><br>${remainingSeats(event)}</p>${currentUser?.role !== 'admin' ? `<button class="btn" style="width:100%" data-action="register" data-id="${safe(event.id)}" ${remainingSeats(event) === 0 ? 'disabled' : ''}>${remainingSeats(event) === 0 ? 'Esgotado' : 'Quero me inscrever'}</button>` : ''}</aside></div>`); }
    function showEventPreview(id) { const event = getEvent(id); if (!event) return; openModal('Prévia para participantes',`<p class="muted small">Este é o card exibido na página de eventos.</p><div class="event-grid">${eventCard(event)}</div>`); document.querySelector('.modal [data-action="register"]')?.remove(); }
    function showRegistrationForm(eventId,manual=false) { const event = getEvent(eventId); if (!event || remainingSeats(event) === 0) { toast('Este evento está esgotado.',true); return; } if (!manual && !currentUser) { pendingRegistrationEventId = eventId; closeModal(); navigate('signup'); return; } openModal(manual ? 'Adicionar inscrição manual' : 'Reservar inscrição',`<p class="muted">${safe(event.title)} · ${formatDate(event.date)} · ${brl(event.price)} por pessoa</p><p class="small">${remainingSeats(event)} vagas disponíveis</p><form id="registration-form" data-event-id="${safe(event.id)}" data-manual="${manual}"><div class="form-grid two"><div class="field"><label for="reg-name">Nome completo *</label><input class="input" id="reg-name" name="name" required maxlength="100" value="${manual ? '' : safe(currentUser.name)}"></div><div class="field"><label for="reg-phone">Telefone com DDD *</label><input class="input" id="reg-phone" name="phone" type="tel" inputmode="tel" required placeholder="(11) 99999-9999" value="${manual ? '' : safe(currentUser.phone || '')}"></div>${manual ? `<div class="field"><label for="reg-email">E-mail *</label><input class="input" id="reg-email" name="email" type="email" required></div>` : ''}<div class="field"><label for="reg-quantity">Quantidade de pessoas *</label><input class="input" id="reg-quantity" name="quantity" type="number" min="1" max="${remainingSeats(event)}" step="1" value="1" required></div><div class="field full"><label for="reg-notes">Observações</label><textarea class="textarea" id="reg-notes" name="notes" maxlength="500" placeholder="Algo que precisamos saber?"></textarea></div></div><p class="small muted">O valor será confirmado manualmente pela organização.</p><button class="btn btn-outline btn-sm" type="button" data-soon="Pagamento online por PIX ou cartão">Pagar online <span class="soon">Em breve</span></button><p class="form-error" id="registration-error" role="alert"></p><div class="form-actions"><button class="btn btn-outline" type="button" data-action="close-modal">Voltar</button><button class="btn" type="submit">Confirmar reserva</button></div></form>`); }
    function showEventForm(id) { const event = id ? getEvent(id) : null; if (id && !event) return; const field = (label,name,type='text',extra='') => `<div class="field"><label for="event-${name}">${label} *</label><input class="input" id="event-${name}" name="${name}" type="${type}" value="${safe(event?.[name] ?? '')}" required ${extra}></div>`; openModal(event ? 'Editar evento' : 'Novo evento',`<form id="event-form" data-event-id="${safe(id || '')}"><div class="form-grid two">${field('Título','title','text','maxlength="120"')}<div class="field"><label for="event-category-field">Categoria *</label><select class="select" id="event-category-field" name="category" required><option value="">Selecione</option>${categories.map(category => `<option value="${category}" ${event?.category === category ? 'selected' : ''}>${category}</option>`).join('')}</select></div>${field('Data','date','date',`min="${futureDate(0)}"`)}${field('Horário de saída','time','time')}${field('Local','location','text','maxlength="120"')}${field('Local de saída','departure','text','maxlength="120"')}${field('Preço por pessoa (R$)','price','number','min="0.01" step="0.01"')}${field('Número de vagas','capacity','number','min="1" step="1"')}<div class="field full"><label for="event-description">Descrição *</label><textarea class="textarea" id="event-description" name="description" required maxlength="1000">${safe(event?.description)}</textarea></div><div class="field full"><label for="event-schedule">Programação *</label><textarea class="textarea" id="event-schedule" name="schedule" required maxlength="1500">${safe(event?.schedule)}</textarea></div><div class="field full"><label for="event-bring">O que levar *</label><textarea class="textarea" id="event-bring" name="bring" required maxlength="1000">${safe(event?.bring)}</textarea></div><div class="field full"><label>Foto ou banner do evento</label><button class="btn btn-outline btn-sm" type="button" data-soon="Upload de foto ou banner do evento">Adicionar imagem <span class="soon">Em breve</span></button></div></div><p class="form-error" id="event-error" role="alert"></p><div class="form-actions"><button class="btn btn-outline" type="button" data-action="close-modal">Cancelar</button><button class="btn" type="submit">${event ? 'Salvar alterações' : 'Criar evento'}</button></div></form>`); }

    /* AÇÕES E VALIDAÇÃO */
    function navigate(destination) { if (destination === 'home' && !currentUser) pendingRegistrationEventId = null; page = destination; if (destination !== 'event-detail') selectedEventId = null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function confirmAction(message) { return window.confirm(message); }
    function validPhone(value) { return /^\d{10,11}$/.test(value.replace(/\D/g,'')); }
    function validEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value); }
    function handleSignup(form) {
      const values = Object.fromEntries(new FormData(form));
      const error = document.getElementById('signup-error');
      if (!values.name.trim() || !validEmail(values.email.trim()) || !validPhone(values.phone) || values.password.length < 6) { error.textContent = 'Confira nome, e-mail, telefone e senha.'; return; }
      if (values.password !== values.confirm) { error.textContent = 'As senhas não são iguais.'; return; }
      try { createAccount(values); toast('Conta criada com sucesso. Seja bem-vindo!'); }
      catch (err) { error.textContent = err.message; }
    }
    function handleRegistration(form) { const values = Object.fromEntries(new FormData(form)); const event = getEvent(form.dataset.eventId); const error = document.getElementById('registration-error'); const quantity = Number(values.quantity); const email = form.dataset.manual === 'true' ? values.email.trim().toLowerCase() : currentUser.email; if (!values.name.trim() || !validPhone(values.phone) || !validEmail(email) || !Number.isInteger(quantity) || quantity < 1 || !event || quantity > remainingSeats(event)) { error.textContent = 'Confira nome, telefone, e-mail e quantidade de vagas.'; return; } try { createRegistration({eventId:event.id,name:values.name.trim(),email,phone:values.phone.trim(),quantity,notes:values.notes.trim()}); closeModal(); render(); toast(form.dataset.manual === 'true' ? 'Inscrição manual adicionada com sucesso.' : 'Inscrição reservada! Aguarde a confirmação do pagamento.'); if (form.dataset.manual !== 'true') openModal('Inscrição reservada!',`<p>Sua vaga foi reservada com carinho. Aguarde a confirmação do pagamento pela organização.</p><p class="muted small">${safe(event.title)} · ${quantity} ${quantity === 1 ? 'pessoa' : 'pessoas'} · ${brl(event.price * quantity)}</p><div class="form-actions"><button class="btn btn-outline" data-soon="Pagamento online por PIX ou cartão">Pagar online <span class="soon">Em breve</span></button><button class="btn" data-action="go-mine">Ver minhas inscrições</button></div>`); } catch (err) { error.textContent = err.message; } }
    function handleEventSave(form) { const values = Object.fromEntries(new FormData(form)); const error = document.getElementById('event-error'); const price = Number(values.price); const capacity = Number(values.capacity); const date = new Date(`${values.date}T12:00:00`); if (!values.title.trim() || !categories.includes(values.category) || !values.location.trim() || !values.departure.trim() || !values.description.trim() || !values.schedule.trim() || !values.bring.trim() || !/^\d{2}:\d{2}$/.test(values.time) || !Number.isFinite(price) || price <= 0 || !Number.isInteger(capacity) || capacity <= 0 || Number.isNaN(date.getTime()) || date.toISOString().slice(0,10) !== values.date || values.date < futureDate(0)) { error.textContent = 'Preencha todos os campos com data, preço e vagas válidos.'; return; } const id = form.dataset.eventId; if (id && capacity < occupiedSeats(id)) { error.textContent = `Este evento já tem ${occupiedSeats(id)} vagas ocupadas.`; return; } const payload = {title:values.title.trim(),category:values.category,date:values.date,time:values.time,location:values.location.trim(),departure:values.departure.trim(),price,capacity,description:values.description.trim(),schedule:values.schedule.trim(),bring:values.bring.trim()}; const saved = id ? updateEvent(id,payload) : createEvent(payload); closeModal(); if (!id) { selectedEventId = null; page = 'admin-events'; } render(); toast(id ? 'Evento atualizado com sucesso.' : 'Evento criado e disponível para os participantes.'); }
    function exportCsv(eventId) { const event = getEvent(eventId); if (!event) return; const rows = [['Nome','E-mail','Telefone','Pessoas','Data da inscrição','Status','Observações'],...getRegistrations(eventId).map(reg => [reg.name,reg.email,reg.phone,reg.quantity,formatTimestamp(reg.createdAt),statusText(reg.status),reg.notes])]; const quote = value => `"${String(value ?? '').replace(/"/g,'""')}"`; const csv = '\uFEFF' + rows.map(row => row.map(quote).join(';')).join('\r\n'); const url = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); const link = document.createElement('a'); link.href = url; link.download = `inscritos-${event.date}-${event.id}.csv`; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),1000); toast('Lista CSV exportada.'); }
    document.addEventListener('submit',event => { if (event.target.id === 'login-form') { event.preventDefault(); const values = Object.fromEntries(new FormData(event.target)); if (!login(values.email,values.password)) document.getElementById('login-error').textContent = 'E-mail ou senha incorretos.'; } else if (event.target.id === 'signup-form') { event.preventDefault(); handleSignup(event.target); } else if (event.target.id === 'registration-form') { event.preventDefault(); handleRegistration(event.target); } else if (event.target.id === 'event-form') { event.preventDefault(); handleEventSave(event.target); } });
    document.addEventListener('input',event => { if (event.target.id === 'event-search') { participantSearch = event.target.value; filterParticipantEvents(); } if (event.target.id === 'admin-search') { adminSearch = event.target.value; filterAdminRegistrations(); } });
    document.addEventListener('change',event => { if (event.target.id === 'event-category') { participantCategory = event.target.value; filterParticipantEvents(); } if (event.target.id === 'admin-status') { adminStatus = event.target.value; filterAdminRegistrations(); } });
    document.addEventListener('click',event => { if (event.target.matches('[data-backdrop]')) { closeModal(); return; } const soon = event.target.closest('[data-soon]'); if (soon) { notImplemented(soon.dataset.soon); return; } const nav = event.target.closest('[data-page]'); if (nav) { event.preventDefault(); navigate(nav.dataset.page); return; } const button = event.target.closest('[data-action]'); if (!button) return; const {action,id} = button.dataset; if (action === 'logout') logout(); else if (action === 'close-modal') closeModal(); else if (action === 'scroll-events') document.getElementById('events-section')?.scrollIntoView({behavior:'smooth'}); else if (action === 'details') showEventDetails(id); else if (action === 'preview-event') showEventPreview(id); else if (action === 'register') showRegistrationForm(id); else if (action === 'go-mine') { closeModal(); navigate('mine'); } else if (action === 'new-event') showEventForm(); else if (action === 'edit-event') showEventForm(id); else if (action === 'manage-event') { selectedEventId = id; adminSearch = ''; adminStatus = ''; navigate('event-detail'); } else if (action === 'manual-registration') showRegistrationForm(id,true); else if (action === 'mark-paid') { markAsPaid(id); render(); toast('Pagamento confirmado.'); } else if (action === 'mark-pending') { markAsPending(id); render(); toast('Inscrição voltou para pendente.'); } else if (action === 'cancel-registration' && confirmAction('Deseja cancelar esta inscrição? A vaga será liberada.')) { cancelRegistration(id); render(); toast('Inscrição cancelada e vaga liberada.'); } else if (action === 'delete-event' && confirmAction('Excluir este evento e todas as inscrições vinculadas? Esta ação não pode ser desfeita.')) { deleteEvent(id); selectedEventId = null; navigate('admin-events'); toast('Evento excluído.'); } else if (action === 'export-csv') exportCsv(id); else if (action === 'restore-demo' && confirmAction('Restaurar os dados de demonstração? Todas as alterações neste navegador serão perdidas.')) { data = cloneSeed(); saveData(); selectedEventId = null; page = 'dashboard'; render(); toast('Dados de demonstração restaurados.'); } });
    document.addEventListener('keydown',event => { if (event.key === 'Escape' && document.querySelector('.modal-layer')) closeModal(); });
    window.addEventListener('storage',event => { if (event.key === STORAGE_KEY) { data = loadData(); render(); } if (event.key === REGISTERED_USERS_KEY) registeredUsers = loadRegisteredUsers(); });
    // TODO: integrar gateway de pagamento
    render();
  </script>
</body>
</html>
